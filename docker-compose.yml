version: '3.4'

services:
  api:
    build:
      context: .
      dockerfile: MSR.Answer.API/Dockerfile
    expose:
      - "5000"
    restart: always
  reverseproxy:
    build:
      context: ./reverseproxy
      dockerfile: Dockerfile
      args:
        - 'NGINX_CONF=local'
    ports:
      - "17777:80"
    links:
      - api
  app:
    build:
      context: ./MSR.UI/MSR.UI.Answer
      dockerfile: Dockerfile
    ports:
      - "3000:80"

