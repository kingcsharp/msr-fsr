version: '3.4'

services:
  api:
    build:
      context: .
      dockerfile: MSR.Answer.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=QA
    restart: always
  reverseproxy:
    build:
      context: ./reverseproxy
      dockerfile: Dockerfile
      args:
        - 'NGINX_CONF=local'
    ports:
      - "17777:80"
    links:
      - api
  messagehub:
    build:
      context: .
      dockerfile: MSR.Answer.MessageHub/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=QA
    restart: always
  messageproxy:
    build:
      context: ./messageproxy
      dockerfile: Dockerfile
      args:
        - 'NGINX_CONF=local'
    ports:
      - "65377:80"
  status:
    image: nginx
#    ports:
#      - "8080:80"
  processor:
    build:
      context: .
      dockerfile: MSR.Answer.Processor/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=QA
    restart: always
    links:
      - api
  app:
    build:
      context: ./MSR.UI/MSR.UI.Answer
      dockerfile: Dockerfile
      args:
        - 'ENV=builddevprodsetting'
    ports:
      - "3000:80"