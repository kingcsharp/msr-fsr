
<div id="parentIntro" class="container-fluid " ng-init="getReports(1,'',['reportName','reportType','isPublic','owner','reportDescription'])" style="padding-top: 10px;">
    <div class="container-fluid">
        <div class="main col-md-12">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-lg-12">
                        <h2 class="page-header">
                            <span class="icon fa fa-list-ol"></span>
                            Ad-Hoc Reports 
                        </h2>
                    </div>
                    <div class="col-lg-12" style="padding-right: 0">
                        <div class="col-lg-12" style="padding-right: 0">
                            <div class="ui-jqgrid " id="gbox_jqGrid" dir="ltr" style="width: 100%; min-width: 400px;">
                                <div class="jqgrid-overlay ui-overlay" id="lui_jqGrid"></div>
                                <div class="ui-jqgrid-view table-responsive" role="grid" id="gview_jqGrid" style="width: 100%;">
                                    <div class="ui-jqgrid-titlebar ui-jqgrid-caption" style="display: none;"><a role="link" class="ui-jqgrid-titlebar-close HeaderButton " title="Toggle Expand Collapse Grid" style="right: 0px;"><span class="ui-jqgrid-headlink glyphicon glyphicon-circle-arrow-up"></span></a><span class="ui-jqgrid-title"></span></div>
                                    <div class="ui-jqgrid-hdiv" style="width: 100%;">
                                        <div class="ui-jqgrid-hbox" style="padding-right: 0">
                                            <table class="ui-jqgrid-htable ui-common-table table table-bordered angulargrid" style="width: 100%" role="presentation" aria-labelledby="gbox_jqGrid">
                                                <thead>
                                                    <tr class="ui-jqgrid-labels" role="row">
                                                        <th id="jqGrid_Id" role="columnheader" class="ui-th-column ui-th-ltr" width="50">
                                                            <span class="ui-jqgrid-resize ui-jqgrid-resize-ltr" style="cursor: col-resize;">&nbsp;</span>
                                                            <div class="ui-th-div ui-jqgrid-sortable" id="jqgh_jqGrid_Id">Name<span class="s-ico" style="display: none"><span sort="asc" class="ui-grid-ico-sort ui-icon-asc ui-sort-ltr ui-disabled glyphicon glyphicon-triangle-top"></span><span sort="desc" class="ui-grid-ico-sort ui-icon-desc ui-sort-ltr ui-disabled glyphicon glyphicon-triangle-bottom"></span></span></div>
                                                        </th>
                                                        <th id="jqGrid_StageName" role="columnheader" class="ui-th-column ui-th-ltr" width="25">
                                                            <span class="ui-jqgrid-resize ui-jqgrid-resize-ltr" style="cursor: col-resize;">&nbsp;</span>
                                                            <div class="ui-th-div ui-jqgrid-sortable" id="jqgh_jqGrid_StageName">
                                                                Status
                                                            </div>
                                                        </th>
                                                        <th id="jqGrid_Actions" role="columnheader" class="ui-th-column ui-th-ltr" width="25">
                                                            <span class="ui-jqgrid-resize ui-jqgrid-resize-ltr" style="cursor: col-resize;">&nbsp;</span>
                                                            <div class="ui-th-div ui-jqgrid-sortable" id="jqgh_jqGrid_Actions">
                                                                Actions
                                                            </div>
                                                        </th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr class="jqgfirstrow" role="row">
                                                        <td role="gridcell" style="height: 0px;"></td>
                                                        <td role="gridcell" style="height: 0px;"></td>
                                                        <td role="gridcell" style="height: 0px;"></td>
                                                    </tr>
                                                    <tr role="row" id="1" tabindex="-1" class="jqgrow ui-row-ltr" ng-repeat="report in reports.items">
                                                        <td role="gridcell" style="text-align: left;" title="dashboard.dashboardName" aria-describedby="jqGrid_Id" ng-bind="report.reportName"></td>
                                                        <td role="gridcell" style="text-align: left;" aria-describedby="jqGrid_StageName"><span ng-if="report.isPublic">Published</span><span ng-if="report.isPublic==false">Draft</span></td>
                                                        <td role="gridcell" style="text-align: center;" aria-describedby="jqGrid_Actions">
                                                            <a ng-href="/Report#/reports/{{report._id}}" tooltip="Click here to execute this report" tooltip-placement="bottom" class="btn btn-xs btn-success" style="margin: 2px; font-size: .8em;">
                                                                <i class="fa fa-eye"></i> View
                                                            </a>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                                <div class="ui-jqgrid-resize-mark" id="rs_mjqGrid">&nbsp;</div>
                                <div id="jqGridPager" class="ui-jqgrid-pager" dir="ltr" style="width: 100%; min-width: 400px;">
                                    <div id="pg_jqGridPager" class="ui-pager-control" role="group">
                                        <table class="ui-pg-table ui-common-table ui-pager-table table">
                                            <tbody>
                                                <tr>
                                                    <td width="34" id="jqGridPager_left" align="left" class="hidden-xs">
                                                        <table class="ui-pg-table navtable ui-common-table">
                                                            <tbody>
                                                                <tr>
                                                                    <td class="ui-pg-button" title="Reload Grid" id="refresh_jqGrid">
                                                                        <div class="ui-pg-div">
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                    </td>
                                                    <td width="33" id="jqGridPager_center" align="center" style="white-space: pre; border: none;"><table class="ui-pg-table ui-common-table ui-paging-pager"><tbody><tr><td id="first_jqGridPager" ng-click="getReports(1,'',['reportName','reportType','isPublic','owner','reportDescription'])" class="ui-pg-button ui-disabled" title="First Page"><span class="glyphicon glyphicon-step-backward"></span></td><td id="prev_jqGridPager" class="ui-pg-button ui-disabled" title="Previous Page" ng-click="getReports(pager.currentPage - 1,'',['reportName','reportType','isPublic','owner','reportDescription'])"><span class="glyphicon glyphicon-backward"></span></td><td class="ui-pg-button ui-disabled"><span class="ui-separator"></span></td><td id="input_jqGridPager" dir="ltr">Page <input class="ui-pg-input form-control" type="text" size="2" maxlength="7" ng-model="pager.currentPage" disabled="disabled" role="textbox"> of <span id="sp_1_jqGridPager" ng-bind="pager.totalPages"></span></td><td class="ui-pg-button ui-disabled"><span class="ui-separator"></span></td><td id="next_jqGridPager" class="ui-pg-button ui-disabled" title="Next Page" ng-click="getDashboards(pager.currentPage + 1,'',['reportName','reportType','isPublic','owner','reportDescription'])"><span class="glyphicon glyphicon-forward"></span></td><td id="last_jqGridPager" class="ui-pg-button ui-disabled" title="Last Page" ng-click="getDashboards(pager.totalPages,'',['reportName','reportType','isPublic','owner','reportDescription'])"><span class="glyphicon glyphicon-step-forward"></span></td><td dir="ltr"><select class="ui-pg-selbox form-control" role="listbox" title="Records per Page"><option role="option" value="10" selected="selected">10</option></select></td></tr></tbody></table></td>
                                                    <td width="33" id="jqGridPager_right" align="right" style="border-top:0">
                                                        <div dir="ltr" style="text-align: right" class="ui-paging-info" ng-if="pager.currentPage">
                                                            View {{((pager.currentPage-1)*10+1)}} - {{pager.currentPage*10}} of {{reports.items.length}}
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
