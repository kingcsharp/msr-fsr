version: '3'

services:
  app:
    image: 425480257575.dkr.ecr.us-west-2.amazonaws.com/msr-api:Dev08
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    logging:
      driver: awslogs
      options:
        awslogs-group: answer3
        awslogs-region: us-west-2
        awslogs-stream-prefix: answer3-api-dev
