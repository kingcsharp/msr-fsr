version: 0.2

env:
  git-credential-helper: yes
  variables:
    REGION: "us-west-2"
    DOCKERFILE: "MSR.Answer.Processor/Dockerfile"
    ECR_REPO: "msr-processor"
    TAG: 'latest'

phases:
  build:
    commands:
      - echo Git commit hash $TAG
      - echo Build started on `date`
      - echo Building the Procecssor Docker image...
      - docker build -f $DOCKERFILE .
