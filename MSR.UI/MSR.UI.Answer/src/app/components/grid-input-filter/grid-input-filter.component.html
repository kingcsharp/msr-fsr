<div *ngIf="show" class="position-relative">
    <input id="{{generatedId}}" pInputText type="text" tooltip="Search by {{filterTooltipLabel}}"
        (input)="dt.filter($event.target.value, searchField, 'contains')" class="ui-column-filter"
        [value]="dt.filters[searchField]?.value" [attr.data-cy]="searchField">
    <i *ngIf="dt.filters[searchField]?.value" class="fclear pi pi-times pointer"
        (click)="cg.filter(dt,searchField)"></i>
</div>
