<button type="button" class="btn btn-primary mr-2" (click)="togglePrintTravelerDialog()"><i
        class="fas fa-print mx-1"></i>Print Traveler</button>

<p-dialog [(visible)]="showPrintTravelerDialog" appendTo="body" styleClass="report"
    [baseZIndex]="100001" [modal]='true' [style]="{width: '50vw'}" data-cy="user-header">
    <p-header>
        Print Traveler Report
    </p-header>
    <div class="report-viewport" style="background-color: blueviolet;">
        <div class="row justify-content-center">
            <qrcode [qrdata]="'https://google.com'" [width]="256" [errorCorrectionLevel]="'M'"></qrcode>
        </div>
        <div class="row">
            <div class="row">
                <h3>Purchase Item Information</h3>
            </div>
            <div class="row">
                <div class="col-6">
                    <div class="col-6">Customer:</div><div class="col-6"></div>
                    <div class="col-6">Product:</div><div class="col-6"></div>
                    <div class="col-6">Procedure:</div><div class="col-6"></div>
                    <div class="col-6">WO Item #:</div><div class="col-6"></div>
                    <div class="col-6">Customer P/O Line:</div><div class="col-6"></div>
                    <div class="col-6"></div><div class="col-6"></div>
                </div>
                <div class="col-6"></div>
            </div>
        </div>
        <div class="row">
            <div class="row">
                <h3>Parts and Procedure Information</h3>
            </div>
            <div class="row">Customer Part #</div>
            <div class="row">
                <div class="card-columns">
                    <div class="card" *ngFor="let workOrderTask of WorkOrder.workOrderTasks">
                        <div class="card-header">
                          {{ workOrderTask.procedureStep?.title}}
                        </div>
                        <div class="card-body">
                          <p class="card-text">{{ workOrderTask.procedureStep?.stepText}}</p>
                        </div>
                      </div>
                </div>
            </div>
        </div>
    </div>
    <p-footer>
        <div class="pull-right">
            <button type="submit" (click)="printTravelerReport()" class="btn btn-primary mb-xs" role="button"
                data-cy="confirmdelete-button">
                <i class="fas fa-print mx-1"></i>Print Report
            </button>
            <button type="submit" (click)="togglePrintTravelerDialog()" class="btn btn-warning mb-xs" role="button"
                data-cy="confirmdelete-button">
                <i class="fas fa-times-circle mx-1"></i>Close
            </button>
        </div>
    </p-footer>
</p-dialog>
