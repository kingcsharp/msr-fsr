<div class="bootstrap-switch-id-showHiddenColumns bootstrap-switch bootstrap-switch-wrapper bootstrap-switch-animate bootstrap-switch-on" style="width: 106px;" (click)="onClickToggle()">
  <div class="bootstrap-switch-container" style="width: 156px; margin-left: 0px;" [style.margin-left]="isOn ? 0 : '-53px'">
    <span class="bootstrap-switch-handle-on bootstrap-switch-primary" style="width: 52px;">ON</span>
    <span class="bootstrap-switch-label" style="width: 52px;">&nbsp;</span>
    <span class="bootstrap-switch-handle-off bootstrap-switch-default" style="width: 52px;">OFF</span>
    <input id="showHiddenColumns" name="unhide-switch" type="checkbox">
  </div>
</div>
