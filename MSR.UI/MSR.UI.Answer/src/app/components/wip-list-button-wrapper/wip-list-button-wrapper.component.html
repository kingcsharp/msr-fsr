<button type="button" class="btn btn-primary" (click)="showWipList()"><i class="fas fa-list mr-1"></i>WIP List</button>
<p-dialog header="WIP List" [(visible)]="showWipListDialog" appendTo="body" [modal]='true'
  [style]="{width: '50vw'}">
  <div class="container">
    <div class="row" *ngIf="showWipListDialog">
        <wipstatus [ngClass]="['w-100']" [takeOverSteps]="false" [isDisplayedInWipList]="false" [(displayWipListDialog)]="showWipListDialog"></wipstatus>
    </div>
  </div>
  <p-footer>
    <div class="pull-right">
      <button type="button" (click)="showWipListDialog = false" class="btn btn-outline-inverse width-100 mb-xs"
        role="button">
        Close
      </button>
    </div>
  </p-footer>
</p-dialog>
