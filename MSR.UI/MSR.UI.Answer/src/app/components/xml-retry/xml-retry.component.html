<span *ngIf="!isFailure" class="badge badge-success rounded-0">
  {{ value }}
</span>

<span *ngIf="isFailure" class="badge badge-danger rounded-0">
  {{ value }}
</span>

<button
  *ngIf="isFailure"
  type="button"
  class="btn btn-sm btn-secondary"
  (click)="retry()"
  [disabled]="isLoading"
  style="margin-left: 5px"
>
  <i class="fas fa-redo" *ngIf="!isLoading"></i>
  <i class="fa fa-spinner fa-spin" *ngIf="isLoading"></i>
  Retry
</button>
