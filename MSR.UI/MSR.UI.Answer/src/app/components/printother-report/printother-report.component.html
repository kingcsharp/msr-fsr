<button
  type="button"
  class="btn btn-sm btn-primary mr-0"
  (click)="togglePrintOtherDialog()"
>
  <i class="fas fa-print mx-1"></i>Print Other
</button>
<p-dialog
  [(visible)]="showPrintOtherDialog"
  (onHide)="onHideePrintOtherDialog()"
  appendTo="body"
  styleClass="report"
  [baseZIndex]="100001"
  [modal]="true"
  [style]="{ width: '50vw' }"
  data-cy="user-header"
>
  <p-header> Print Other </p-header>
  <div class="row printotherreport-dropdown">
    <div class="col-2 d-flex justify-content-end">
      <div class="my-auto">Report Type:</div>
    </div>
    <div class="col-10">
      <p-dropdown
        [options]="reportsAvailable"
        [(ngModel)]="selectedReport"
        placeholder="Select"
      ></p-dropdown>
    </div>
  </div>
  <div class="report-viewport d-print-flex">
    <!--Delivery Ticket -->
    <delivery-ticket-report
      *ngIf="selectedReport === 'DeliveryTicket'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.MSRFSR"
    ></delivery-ticket-report>
    <delivery-ticket-report
      *ngIf="selectedReport === 'DeliveryTicketKoMiCo'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.KoMiCo"
    ></delivery-ticket-report>
    <delivery-ticket-report
      *ngIf="selectedReport === 'DeliveryTicketNoLogo'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.NoLogo"
    ></delivery-ticket-report>
    <!--End Delivery Ticket -->

    <!--Detailed Packing List -->
    <detailed-packing-list
      *ngIf="selectedReport === 'DetailedPackingList'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.MSRFSR"
    ></detailed-packing-list>
    <detailed-packing-list
      *ngIf="selectedReport === 'DetailedPackingListKoMiCo'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.KoMiCo"
    ></detailed-packing-list>
    <detailed-packing-list
      *ngIf="selectedReport === 'DetailedPackingListNoLogo'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.NoLogo"
    ></detailed-packing-list>
    <!--End Detailed Packing List -->

    <cert-of-compliance
      [WorkOrder]="WorkOrder"
      *ngIf="selectedReport === 'CertOfCompliance'"
    ></cert-of-compliance>
    <wip-history-report
      [WorkOrder]="WorkOrder"
      *ngIf="selectedReport === 'WIPHistoryReport'"
    ></wip-history-report>
    <ncr-report
      [WorkOrder]="WorkOrder"
      *ngIf="selectedReport === 'NCRReport'"
    ></ncr-report>
    <technical-data-label
      [WorkOrder]="WorkOrder"
      *ngIf="selectedReport === 'TechnicalDataLabel'"
    ></technical-data-label>

    <!--Part Label Roll -->
    <part-label-roll
      *ngIf="selectedReport === 'PartLabelRoll4in'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.MSRFSR"
    ></part-label-roll>
    <part-label-roll
      *ngIf="selectedReport === 'PartLabelRoll4inKoMiCo'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.KoMiCo"
    ></part-label-roll>
    <part-label-roll
      *ngIf="selectedReport === 'PartLabelRoll4inNoLogo'"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.NoLogo"
    ></part-label-roll>
    <part-label-roll
      *ngIf="selectedReport === 'PartLabelRoll4inOuterInner'"
      [innerOuter]="true"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.MSRFSR"
    ></part-label-roll>
    <!--End Part Label Roll -->

    <!-- Outer Inner Labels -->
    <outer-inner-labels
      *ngIf="selectedReport === 'PartLabelRoll4in2inOuter' || selectedReport === 'PartLabelRoll4in2inInner'"
      [selectedReport]="selectedReport"
      [WorkOrder]="WorkOrder"
      [printLogo]="enumWipPrintLogo.MSRFSR"
    ></outer-inner-labels>
    <!-- End Outer Inner Labels -->

    <work-report
      [WorkOrder]="WorkOrder"
      *ngIf="selectedReport === 'WorkReport'"
    ></work-report>
    <ncr-label
      [WorkOrder]="WorkOrder"
      *ngIf="selectedReport === 'NCRLabel'"
    ></ncr-label>
  </div>
  <p-footer>
    <div class="pull-right">
      <button
        type="submit"
        (click)="print()"
        class="btn btn-primary mb-xs"
        role="button"
        data-cy="confirmdelete-button"
      >
        <i class="fas fa-print mx-1"></i>Print
      </button>
      <button
        type="submit"
        (click)="togglePrintOtherDialog()"
        class="btn btn-warning mb-xs"
        role="button"
        data-cy="confirmdelete-button"
      >
        <i class="fas fa-times-circle mx-1"></i>Close
      </button>
    </div>
  </p-footer>
</p-dialog>
