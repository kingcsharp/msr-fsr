<button type="button" class="btn btn-sm btn-primary mr-0" (click)="togglePrintOtherDialog()"><i class="fas fa-print mx-1"></i>Print Other</button>
<p-dialog [(visible)]="showPrintOtherDialog" (onHide)="onHideePrintOtherDialog()" appendTo="body" styleClass="report" [baseZIndex]="100001" [modal]='true' [style]="{width: '50vw'}" data-cy="user-header">
    <p-header>
        Print Other
    </p-header>
    <div class="row printotherreport-dropdown">
        <div class="col-2 d-flex justify-content-end">
            <div class="my-auto">Report Type:</div>
        </div>
        <div class="col-10">
            <p-dropdown [options]="reportsAvailable" [(ngModel)]="selectedReport"  placeholder="Select"></p-dropdown>
        </div>
    </div>
    <div class="report-viewport d-print-flex">
        <delivery-ticket-report [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'DeliveryTicket'"></delivery-ticket-report>
        <detailed-packing-list [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'DetailedPackingList'"></detailed-packing-list>
        <cert-of-compliance [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'CertOfCompliance'"></cert-of-compliance>
        <wip-history-report [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'WIPHistoryReport'"></wip-history-report>
        <ncr-report [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'NCRReport'"></ncr-report>
        <technical-data-label [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'TechnicalDataLabel'"></technical-data-label>
        <part-label-roll [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'PartLabelRoll4in'"></part-label-roll>
        <work-report [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'WorkReport'"></work-report>
        <ncr-label [WorkOrder]="WorkOrder" *ngIf="selectedReport === 'NCRLabel'"></ncr-label>
    </div>
    <p-footer>
        <div class="pull-right">
            <button type="submit" (click)="print()" class="btn btn-primary mb-xs" role="button" data-cy="confirmdelete-button">
                <i class="fas fa-print mx-1"></i>Print
            </button>
            <button type="submit" (click)="togglePrintOtherDialog()" class="btn btn-warning mb-xs" role="button"
                data-cy="confirmdelete-button">
                <i class="fas fa-times-circle mx-1"></i>Close
            </button>
        </div>
    </p-footer>
</p-dialog>
