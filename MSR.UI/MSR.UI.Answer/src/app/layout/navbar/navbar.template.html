<nav class="navbar-collapse">
  <form id="search-form" class="navbar-form" role="search">
    <div class="form-group mb-0">
      <div class="input-group-transparent input-group">
        <!-- <div class="input-group-addon">
          <i class="fa fa-search text-white"></i>
        </div> -->
        <!-- <input placeholder="Search..." type="text" class="input-transparent form-control"> -->
      </div>
    </div>
  </form>
  <ul class="nav navbar-nav">
    <li class="nav-item visible-phone-landscape">
      <a (click)="searchFormOpen()" class="nav-link" href="#" id="search-toggle">
        <i class="fa fa-search"></i>
      </a>
    </li>
    <li class="nav-item dropdown">
      <a href tooltip="{{notificationCount+' new notifications'}}" class="nav-link dropdown-toggle"
        data-toggle="dropdown">
        <i class="fad fa-bell" [ngClass]="notificationCount>0?'btn-outline-danger':''"></i>
        <span class="count" data-cy="page-notificationcount">{{notificationCount}}</span>
      </a>
      <ul id="support-menu" class="dropdown-menu dropdown-menu-right support" role="menu">
        <li role="presentation">
          <a href="javascript:;" class="dropdown-item support-ticket ">
            <div class="picture">
              <span class="badge"
                [ngClass]="{'badge-success': notificationCount==0, 'badge-danger': notificationCount>0}">{{notificationCount}}</span>
            </div>
            <div class="details">
              Notifications
            </div>
          </a>
        </li>
        <li *ngFor="let item of notificationData.items" role="presentation">
          <a href="/#/app/workflow/pendingapproval/{{item.table}}" class="dropdown-item support-ticket ">
            <div class="picture">
              <span class="badge badge-success">{{item.count}}</span>
            </div>
            <div class="details">
              {{item.name}}
            </div>
          </a>
        </li>
        <li role="presentation">
          <a href="/#/app/workflow/pendingapproval/9" class="dropdown-item support-ticket ">
            <div class="picture">
            </div>
            <div class="text-center">
              <b>View All</b>
            </div>
          </a>
        </li>
      </ul>
    </li>
    <li class="divider"></li>
    <li class="nav-item dropdown d-sm-down-none">
      <a href="javascript:;" id="account" data-cy="account-a"tooltip="Account" class="nav-link dropdown-toggle" data-toggle="dropdown">
        <img *ngIf="globals.user.fileModel === undefined" width="34" src="assets/img/2.png" alt="">
        <img *ngIf="globals.user.fileModel !== undefined" width="34" [src]="globals.user.fileModel.fileURL" alt="">
      </a>
      <ul id="account-menu" class="dropdown-menu dropdown-menu-right account" role="menu">
        <li role="presentation" class="account-picture">
          <img *ngIf="globals.user.fileModel === undefined" width="34" src="assets/img/2.png" alt="">
        <img *ngIf="globals.user.fileModel !== undefined" width="34" [src]="globals.user.fileModel.fileURL" alt="">
          {{globals.user.firstName + ' ' + globals.user.lastName}}
        </li>
        <li role="presentation">
          <a data-cy="profile-link" routerLink="../app/people/profile" class="dropdown-item">
            <i class="fad fa-user"></i>
            Profile
          </a>
        </li>
      </ul>
    </li>
    <li class="d-md-none mr-3">
      <a href="#" (click)="sidebarOpen()" class="btn-navbar" data-toggle="collapse" data-target=".sidebar" title="">
        <i class="fa fa-bars"></i>
      </a>
    </li>
    <li class="nav-item d-sm-down-none">
      <a class="nav-link" (click)="logout()" tooltip="Logout" data-cy="logout-link"><i
          class="glyphicon glyphicon-off"></i></a>
    </li>
  </ul>
</nav>
