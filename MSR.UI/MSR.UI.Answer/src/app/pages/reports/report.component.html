<h1 class="page-title" data-cy="page-title">
    <i class="far fa-chart-bar"></i>
    Adhoc Reports
</h1>
<widget>
    <div class="row card-deck mt-3" *ngIf="data">
        <ng-container *ngFor="let item of data; index as i; " [ngTemplateOutlet]="rowView"
            [ngTemplateOutletContext]="{rowData: { item: item, index: i} }"></ng-container>
    </div>
</widget>
<ng-template #rowView let-rowData='rowData'>
    <div class="card mb-4">
        <img class="card-img-top img-fluid" src="{{rowData.item.imageUrl}}" alt="Card image cap">
        <div class="card-body">
            <h4 class="card-title">{{rowData.item.name}}</h4>
            <div class="card-subtitle mb-1 font-italic font-weight-bold text-muted">{{rowData.item.subtitle}}</div>
            <p class="card-text">{{rowData.item.description}}</p>
        </div>
        <div class="card-category"><small class="text-muted">
                Categories:
                <span class="badge badge-dark rounded-0" *ngFor="let category of rowData.item.categories">
                    {{category.name}}
                </span>
            </small>
        </div>
        <div class="card-footer">
            <div class="card-actions">
                <a [routerLink]="['../adhocreports',rowData.item.id]" class="btn btn-primary rounded-0"><i class="fa fa-eye"></i> View</a>
                <a href="#" class="btn btn-success rounded-0"><i class="fa fa-print"></i> Print</a>
            </div>
        </div>
    </div>
    <div *ngIf="(rowData.index+1) % 2 === 0" class="w-100 d-none d-sm-block d-md-none">
    </div>
    <div *ngIf="(rowData.index+1) % 3 === 0" class="w-100 d-none d-md-block d-lg-none">
    </div>
    <div *ngIf="(rowData.index+1) % 4 === 0" class="w-100 d-none d-lg-block d-xl-none">
    </div>
    <div *ngIf="(rowData.index+1) % 5 === 0" class="w-100 d-none d-xl-block">
    </div>
</ng-template>
