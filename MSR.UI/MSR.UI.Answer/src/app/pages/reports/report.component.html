<h1 class="page-title" data-cy="page-title">
    <i class="far fa-chart-bar"></i>
    Adhoc Reports
</h1>
<widget>
    <div class="row card-deck mt-3">
        <div class="card mb-4 workorder part" *ngFor="let item of data">
            <img class="card-img-top img-fluid" src="{{item.imageUrl}}" alt="Card image cap">
            <div class="card-body">
                <h4 class="card-title">{{item.name}}</h4>
                <div class="card-subtitle mb-1 font-italic font-weight-bold text-muted">{{item.subtitle}}</div>
                <p class="card-text">{{item.description}}</p>
            </div>
            <div class="card-category"><small class="text-muted">
                    Categories:
                    <span class="badge badge-dark rounded-0" *ngFor="let category of data.categories">
                        {{category.reportCategory.name}}
                    </span>
                </small>
            </div>
            <div class="card-footer">
                <div class="card-actions">
                    <a href="#" class="btn btn-primary rounded-0"><i class="fa fa-eye"></i> View</a>
                    <a href="#" class="btn btn-success rounded-0"><i class="fa fa-print"></i> Print</a>
                </div>
            </div>
        </div>

    </div>
</widget>
