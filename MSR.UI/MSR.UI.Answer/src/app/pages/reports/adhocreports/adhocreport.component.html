<h1 class="page-title" data-cy="page-title">
    <i class="fas fa-clock-o"></i>
    Adhoc-Reports
</h1>
<widget>
    <p-table #dt *ngIf="showReport" [value]="data" dataKey="id" styleClass="ui-table-customers" [rowHover]="true"
        [rows]="10" [showCurrentPageReport]="true" [rowsPerPageOptions]="[10,25,50,100]" [paginator]="true"
        currentPageReportTemplate="Showing {first}-{last} of {totalRecords}" [filterDelay]="0" stateStorage="local"
        stateKey="{{gridSaved.storageId}}">
        <ng-template pTemplate="caption">
            <div class="pull-left">
                <h3><span class="fw-semi-bold">{{reportInfo.name}}</span>- {{reportInfo.subtitle}}</h3>
            </div>
            <div class="pull-right">
                <grid-options [(defaultColumns)]="gridSaved.columnsSaved" [gridStorageId]="gridSaved.storageId"
                    [ptable]="dt" [gridVersion]="gridSaved.version" data-cy="usergrid-options">
                </grid-options>
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th *ngFor="let col of gridSaved.columnsSaved" [hidden]="!col.visible" [pSortableColumn]="col.id"
                    data-cy="usertable-header">
                    {{col.label}} <p-sortIcon [field]="col.id"></p-sortIcon>
                </th>
                <th>Actions</th>
            </tr>
            <tr>
                <ng-container *ngFor="let col of gridSaved.columnsSaved" [ngTemplateOutlet]="rowView"
                    [ngTemplateOutletContext]="{colsAndSettings: { col: col,dt:dt,gridSaved:gridSaved} }">
                </ng-container>
                <th></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-itemData>
            <tr class="ui-selectable-row">
                <ng-container *ngFor="let col of gridSaved.columnsSaved" [ngTemplateOutlet]="rowViewData"
                    [ngTemplateOutletContext]="{colsDataAndSettings: { col: col,colData:itemData,colsSaved:gridSaved.columnsSaved} }">
                </ng-container>
                <td></td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="8" style="text-align:left">No workflow groups found.</td>
            </tr>
        </ng-template>
    </p-table>
</widget>

<ng-template #rowViewData let-colsDataAndSettings='colsDataAndSettings'>
    <td class="text-capitalize"
        *ngIf="colsDataAndSettings.col.type === enumColumnType.String || colsDataAndSettings.col.type === enumColumnType.Number"
        [hidden]="!cg.isVisibleCol(colsDataAndSettings.col.id,colsDataAndSettings.colsSaved)">
        {{colsDataAndSettings.colData[colsDataAndSettings.col.id]}}
    </td>
    <td class="text-capitalize" *ngIf="colsDataAndSettings.col.type === enumColumnType.Date"
        [hidden]="!cg.isVisibleCol(colsDataAndSettings.col.id,colsDataAndSettings.colsSaved)">
        {{colsDataAndSettings.colData[colsDataAndSettings.col.id] | userTimezone }}
    </td>
</ng-template>


<ng-template #rowView let-colsAndSettings='colsAndSettings'>
    <th *ngIf="colsAndSettings.col.dropdownHeader"
        [hidden]="!cg.isVisibleCol(colsAndSettings.col.id,colsAndSettings.gridSaved.columnsSaved)">
        <multiselect-wrapper [gridStorageId]="colsAndSettings.gridSaved.storageId" [options]="data"
            filterProp="{{colsAndSettings.col.id}}" defaultId="{{colsAndSettings.col.id}}"
            filterId="{{colsAndSettings.col.id}}" defaultText="Select {{colsAndSettings.col.label}}"
            defaultTextTooltip="" [datatable]="dt">
        </multiselect-wrapper>
    </th>
    <th *ngIf="colsAndSettings.col.type === enumColumnType.String && !colsAndSettings.col.dropdownHeader"
        grid-input-filter [dt]="colsAndSettings.dt" searchField="{{colsAndSettings.col.id}}"
        [hidden]="!cg.isVisibleCol(colsAndSettings.col.id,colsAndSettings.gridSaved.columnsSaved)"
        [gridSettings]="colsAndSettings.gridSaved.columnsSaved">
    </th>
    <th *ngIf="colsAndSettings.col.type === enumColumnType.Number && !colsAndSettings.col.dropdownHeader"
        grid-input-filter [dt]="colsAndSettings.dt" searchField="{{colsAndSettings.col.id}}"
        [hidden]="!cg.isVisibleCol(colsAndSettings.col.id,colsAndSettings.gridSaved.columnsSaved)"
        [gridSettings]="colsAndSettings.gridSaved.columnsSaved">
    </th>
    <th *ngIf="colsAndSettings.col.type === enumColumnType.Date && !colsAndSettings.col.dropdownHeader"
        [hidden]="!cg.isVisibleCol(colsAndSettings.col.id,colsAndSettings.gridSaved.columnsSaved)">
        <div class="position-relative" tooltip="{{colsAndSettings.col.label}}">
            <pcalendar-wrapper [gridStorageId]="colsAndSettings.gridSaved.storageId" [filterId]="colsAndSettings.col.id"
                [datatable]="colsAndSettings.dt">
            </pcalendar-wrapper>
        </div>
    </th>
</ng-template>
