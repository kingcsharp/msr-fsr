<div class="container">
    <div class="row">
        <h1 class="page-title">
            Create Customer
        </h1>
    </div>
    <div class="row" *ngIf="customer != null">
        <form class="col-12">
            <div class="form-group">
                <label for="name" class="col-form-label text-left">
                    Name
                </label>
                <input type="text" id="name" name="name" [(ngModel)]="customer.name"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent" tooltip="Name"
                    placeholder="" data-cy="title-input">
            </div>
            <div class="form-group">
                <label for="address" class="col-form-label text-left">
                    Address
                </label>
                <input type="text" id="address" name="address" [(ngModel)]="customer.address"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent" tooltip="Address"
                    placeholder="" data-cy="title-input">
            </div>
            <div class="form-group">
                <label for="phone" class="col-form-label text-left">
                    Phone
                </label>
                <input type="text" id="address" name="address" [(ngModel)]="customer.phone"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent" tooltip="Phone"
                    placeholder="" data-cy="title-input">
            </div>
            <div class="form-group">
                <label for="customernumber" class="col-form-label text-left">
                    Customer Number
                </label>
                <input type="text" id="customernumber" name="customernumber" [(ngModel)]="customer.customerNumber"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent" tooltip="Customer Number"
                    placeholder="" data-cy="title-input">
            </div>
        </form>
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary m-2" (click)="saveLocation()" *ngIf="customer.id == 0">Save</button>
        <button type="button" class="btn btn-primary m-2" (click)="updateLocation()" *ngIf="customer.id != 0">Update</button>
        <button type="button" class="btn btn-warning m-2" [routerLink]="['../locations']">Cancel</button>
    </div>
</div>
