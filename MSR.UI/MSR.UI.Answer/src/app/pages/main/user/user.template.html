<h1 class="page-title">Users <small><small>USERS ONE</small></small></h1>
<widget [fetchingData]="userService.isReceiving">
  <table class="table table-striped"  [mfData]="data" #mf="mfDataTable" [mfRowsOnPage]="5">
    <thead>
      <tr>
        <th style="width: 5%">
          <mfDefaultSorter by="id">Id</mfDefaultSorter>
        </th>
        <th style="width: 20%">
          <mfDefaultSorter by="firstName">First Name</mfDefaultSorter>
        </th>
        <th style="width: 20%">
          <mfDefaultSorter by="lastName">Last Name</mfDefaultSorter>
        </th>
        <th style="width: 20%">
          <mfDefaultSorter by="userName">Username</mfDefaultSorter>
        </th>
        <th style="width: 20%">
          <mfDefaultSorter by="email">Email</mfDefaultSorter>
        </th>
        <th style="width: 15%">
          <mfDefaultSorter by="email">Actions</mfDefaultSorter>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of mf.data">
        <td>{{item.id}}</td>
        <td>{{item.firstName}}</td>
        <td>{{item.lastName}}</td>
        <td>{{item.userName}}</td>
        <td>{{item.email}}</td>
        <td></td>
        <!-- <td>{{item.email}}</td>
        <td>{{item.city | uppercase}}</td> -->
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="4">
          <mfBootstrapPaginator [rowsOnPageSet]="[5,10,25]"></mfBootstrapPaginator>
        </td>
      </tr>
    </tfoot>
  </table>
</widget>
