<div class="container-fluid">
    <div class="row">
        <div class="col-6">
            <h1 class="page-title">
                <i [ngClass]="'fas '+globals.activeMenu.icon"></i>
                {{globals.activeMenu.name}}
            </h1>
        </div>
    </div>
 </div>
        <widget>
            <p-table #dt [value]="data" dataKey="id" styleClass="ui-table-customers" [rowHover]="true" [rows]="10"
                [showCurrentPageReport]="true"  currentPageReportTemplate="Showing {first}-{last} of {totalRecords}"
                [rowsPerPageOptions]="[10,25,50,100]"  [paginator]="true"  [filterDelay]="0"
                [filterDelay]="1300" [lazy]="true" (onLazyLoad)="getTrainingCertification($event)" [totalRecords]="totalRecords"
                stateStorage="local"  stateKey="{{gridStorageId}}">
                <ng-template pTemplate="caption">
                    <div class="text-right">
                        <grid-options [(defaultColumns)]="gridSettings" [gridStorageId]="gridStorageId" [ptable]="dt"
                            [gridVersion]="gridVersion"  data-cy="usergrid-options"  [hidden]="false">
                        </grid-options>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th *ngFor="let col of gridSettings" [hidden]="!col.visible" [pSortableColumn]="col.id"
                            data-cy="certifications-header">
                            {{col.label}} <p-sortIcon [field]="col.id"></p-sortIcon>
                        </th>
                    </tr>
                    <tr>
                        <th grid-input-filter [dt]="dt" searchField="userId"
                            [hidden]="!commonGrid.isVisibleCol('userId',gridSettings)"
                            [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="employeeName"
                            [hidden]="!commonGrid.isVisibleCol('employeeName',gridSettings)"
                            [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="certificationName"
                            [hidden]="!commonGrid.isVisibleCol('certificationName',gridSettings)"
                            [gridSettings]="gridSettings">
                        </th>
                        <th [hidden]="!commonGrid.isVisibleCol('certificationFromDate',gridSettings)">
                            <div class="position-relative" tooltip="Search by From Date">
                                <pcalendar-wrapper [gridStorageId]="gridStorageId" filterId="certificationFromDate"
                                    [datatable]="dt">
                                </pcalendar-wrapper>
                            </div>
                        </th>
                        <th [hidden]="!commonGrid.isVisibleCol('certificationToDate',gridSettings)">
                            <div class="position-relative" tooltip="Search by To Date">
                                <pcalendar-wrapper [gridStorageId]="gridStorageId" filterId="certificationToDate"
                                    [datatable]="dt">
                                </pcalendar-wrapper>
                            </div>
                        </th>
                        <th [hidden]="!commonGrid.isVisibleCol('status',gridSettings)">
                            <div class="position-relative">
                                <multiselect-wrapper [gridStorageId]="gridStorageId" [options]="statusOptions"
                                    [filterId]="'status'" [defaultText]="'Select Status'" [defaultTextTooltip]="''"
                                    [datatable]="dt">
                                </multiselect-wrapper>
                            </div>
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-certification>
                    <tr class="ui-selectable-row">
                        <td [hidden]="!commonGrid.isVisibleCol('userId', gridSettings)">
                            {{certification.userId}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('employeeName', gridSettings)">
                            {{certification.employeeName}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('certificationName', gridSettings)">
                            {{certification.certificationName}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('certificationFromDate', gridSettings)">
                            {{certification.certificationFromDate  | userTimezone}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('certificationToDate', gridSettings)">
                            {{certification.certificationToDate  | userTimezone}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('status', gridSettings)">
                            {{certification.status}}
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="5" style="text-align:left">No Certifications to Display</td>
                    </tr>
                </ng-template>
            </p-table>
        </widget>
