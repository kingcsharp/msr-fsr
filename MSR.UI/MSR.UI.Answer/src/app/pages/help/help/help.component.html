<div class="container">
    <div class="row">
        <h1 class="page-title">
            <i class="fas fa-life-bouy"></i>
            Help Pages
        </h1>
    </div>
    <div class="row">
        <widget>
            <p-table #dt [value]="data" dataKey="id" styleClass="ui-table-customers" [rowHover]="true" [rows]="10"
              [showCurrentPageReport]="true" currentPageReportTemplate="Showing {first}-{last} of {totalRecords}" [rowsPerPageOptions]="[10,25,50,100]" 
              [loading]="loading" [paginator]="true" [filterDelay]="0" stateStorage="local"
              stateKey="{{gridStorageId}}">
              <ng-template pTemplate="caption">
                <div class="text-right">
                  <button *ngIf="canAddHelpPages" (click)="showDialog()" class="btn btn-success width-100 mb-xs sm-mrg" role="button"
                    data-cy="add-button">
                    + Add
                  </button>
                  <grid-options [(defaultColumns)]="gridSettings" [gridStorageId]="gridStorageId" [ptable]="dt"
                    [gridVersion]="gridVersion" data-cy="usergrid-options">
                  </grid-options>
                </div>
              </ng-template>
              <ng-template pTemplate="header">
                <tr>
                  <th *ngFor="let col of gridSettings" [hidden]="!col.visible" [pSortableColumn]="col.id"
                    data-cy="usertable-header">
                    {{col.label}} <p-sortIcon [field]="col.id"></p-sortIcon>
                  </th>
                </tr>
                <tr>
                  <th [hidden]="!commonGrid.isVisibleCol('id',gridSettings)">
                    <div class="position-relative">
                      <input id="id" pInputText type="text" tooltip="Search by Id"
                        (input)="dt.filter($event.target.value, 'id', 'contains')" class="ui-column-filter"
                        [value]="dt.filters['id']?.value">
                      <i *ngIf="dt.filters['id']?.value" class="fclear pi pi-times pointer" (click)="commonGrid.filter(dt,'id')"></i>
                    </div>
                  </th>
                  <th [hidden]="!commonGrid.isVisibleCol('title',gridSettings)">
                    <div class="position-relative">
                      <input id="title" pInputText type="text" tooltip="Search by Friendly Url"
                        (input)="dt.filter($event.target.value, 'title', 'contains')" class="ui-column-filter"
                        [value]="dt.filters['title']?.value">
                      <i *ngIf="dt.filters['title']?.value" class="fclear pi pi-times pointer" (click)="commonGrid.filter(dt,'title')"></i>
                    </div>
                  </th>
                  <th [hidden]="!commonGrid.isVisibleCol('friendlyURL',gridSettings)">
                    <div class="position-relative">
                      <input id="friendlyURL" pInputText type="text" tooltip="Search by Friendly Url"
                        (input)="dt.filter($event.target.value, 'friendlyURL', 'contains')" class="ui-column-filter"
                        [value]="dt.filters['friendlyURL']?.value">
                      <i *ngIf="dt.filters['friendlyURL']?.value" class="fclear pi pi-times pointer" (click)="commonGrid.filter(dt,'friendlyURL')"></i>
                    </div>
                  </th>
                  <th [hidden]="!commonGrid.isVisibleCol('roles',gridSettings)">
                    <div class="position-relative">
                      <!--<multiselect-wrapper [gridStorageId]="gridStorageId" [options]="roles" [filterId]="roleFilter"
                        [defaultText]="'Select Roles'" [defaultTextTooltip]="Roles" [datatable]="dt">
                      </multiselect-wrapper>-->
                    </div>
                  </th>
                  <th [hidden]="!commonGrid.isVisibleCol('actions',gridSettings)"></th>
                </tr>
              </ng-template>
              <ng-template pTemplate="body" let-helpPage>
                <tr class="ui-selectable-row">
                  <td [hidden]="!commonGrid.isVisibleCol('id', gridSettings)">
                    {{helpPage.id}}
                  </td>
                  <td [hidden]="!commonGrid.isVisibleCol('title', gridSettings)">
                    {{helpPage.title}}
                  </td>
                  <td [hidden]="!commonGrid.isVisibleCol('friendlyURL', gridSettings)">
                    {{helpPage.friendlyURL}}
                  </td>
                  <td [hidden]="!commonGrid.isVisibleCol('roles', gridSettings)">
                    <span *ngFor="let role of helpPage.roles" class="badge mr-xs badge-secondary">{{role.name}}</span>
                  </td>
                  <td [hidden]="!commonGrid.isVisibleCol('actions', gridSettings)">
                    Action Buttons
                  </td>
                </tr>
              </ng-template>
              <ng-template pTemplate="emptymessage">
                <tr>
                  <td colspan="8" style="text-align:left">No Help Pages to Display</td>
                </tr>
              </ng-template>
            </p-table>
          </widget>
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary m-2" [routerLink]="['../help-create']">Add</button>
    </div>
</div>
