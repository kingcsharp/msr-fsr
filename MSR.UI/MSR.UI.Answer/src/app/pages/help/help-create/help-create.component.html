<div class="container">
    <div class="row">
        <h1 class="page-title">
            Create Help Page
        </h1>
    </div>
    <div class="row" *ngIf="helpPageToEdit != null">
        <form class="col-12">
            <div class="form-group">
                <label for="title" class="col-form-label text-left">
                    Title
                </label>
                <input type="text" id="title" name="title" [(ngModel)]="helpPageToEdit.title"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent" tooltip="Title of Help Page"
                    placeholder="" data-cy="title-input">
            </div>
            <div class="form-group">
                <label for="friendlyurl" class="col-form-label text-left">
                    Friendly Url
                </label>
                <input type="text" id="friendlyurl" name="friendlyurl" [(ngModel)]="helpPageToEdit.friendlyURL"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent"
                    tooltip="Friendly Url of Help Page" placeholder="Url of the page e.g. Parts/Update Or Parts"
                    data-cy="friendlyurl-input">
            </div>
            <div class="form-group">
                <label for="articlecontent" class="col-form-label text-left">
                    Article Content
                </label>
                <ckeditor-wrapper [editorcontent]="helpPageToEdit.content"></ckeditor-wrapper>
            </div>
            <div class="form-group">
                <label for="roles" class="col-form-label text-left">
                    Roles
                </label>
                <p-multiSelect name="role" [options]="availableRoles" [(ngModel)]="selectedRoles" optionLabel="name"
                    [itemSize]="15" [baseZIndex]="100002" appendTo="body">
                    <ng-template let-value pTemplate="selectedItems">
                        <div *ngFor="let val of value" class="ui-multiselected-item-token ui-corner-all">
                            <span>{{val.name}}</span>
                        </div>
                        <span *ngIf="!value || value.length === 0">Select Roles</span>
                    </ng-template>
                </p-multiSelect>
            </div>
        </form>
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary m-2" (click)="saveHelpPage()" *ngIf="helpPageToEditId == 0">Save</button>
        <button type="button" class="btn btn-primary m-2" (click)="updateHelpPage()" *ngIf="helpPageToEditId != 0">Update</button>
        <button type="button" class="btn btn-warning m-2" [routerLink]="['../help']">Cancel</button>
    </div>
</div>
