<div class="container-flex">
    <div class="row">
      <div class="col-6">
        <h1 class="page-title">
          <i [ngClass]="'fas '+globals.activeMenu.icon"></i>
          {{globals.activeMenu.name}}
        </h1>
      </div>
      <div class="col-6" [ngClass]="['d-flex', 'justify-content-end']">
        <helpbutton-wrapper [ngClass]="['my-auto']"></helpbutton-wrapper>
      </div>
    </div>
    <div class="row">
        <widget>
            <p-table #dt [value]="data" dataKey="id" styleClass="ui-table-customers" [rowHover]="true" [rows]="10"
                [showCurrentPageReport]="true"  currentPageReportTemplate="Showing {first}-{last} of {totalRecords}"
                [rowsPerPageOptions]="[10,25,50,100]"  [loading]="loading"  [paginator]="true"  [filterDelay]="0"
                stateStorage="local"  stateKey="{{gridStorageId}}">
                <ng-template pTemplate="caption">
                    <div class="text-right">
                        <button *ngIf="canAdd" [routerLink]="['../proceduretype-create']"
                            class="btn btn-success width-100 mb-xs sm-mrg" role="button" data-cy="add-button">
                            + Add
                        </button>
                        <grid-options [(defaultColumns)]="gridSettings" [gridStorageId]="gridStorageId" [ptable]="dt"
                            [gridVersion]="gridVersion"  data-cy="usergrid-options"  [hidden]="false">
                        </grid-options>
                    </div>
                </ng-template>
                <ng-template pTemplate="header" *ngIf="data.length !== 0">
                    <tr>
                        <th *ngFor="let col of gridSettings" [hidden]="!col.visible" [pSortableColumn]="col.id"
                            data-cy="monitors-header">
                            {{col.label}} <p-sortIcon [field]="col.id" *ngIf="col.label !== 'Actions'"></p-sortIcon>
                        </th>
                    </tr>
                    <tr>
                        <th grid-input-filter [dt]="dt" searchField="id"
                            [hidden]="!commonGrid.isVisibleCol('id',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="description"
                            [hidden]="!commonGrid.isVisibleCol('description',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="monitorType"
                            [hidden]="!commonGrid.isVisibleCol('monitorType',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="result"
                            [hidden]="!commonGrid.isVisibleCol('result',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="passing"
                            [hidden]="!commonGrid.isVisibleCol('passing',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                        <th grid-input-filter [dt]="dt" searchField="workerName"
                            [hidden]="!commonGrid.isVisibleCol('workerName',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                        <th [hidden]="!commonGrid.isVisibleCol('taskCompleted',gridSettings)">
                            <div class="position-relative" tooltip="Search by Task Completed Date">
                              <pcalendar-wrapper [gridStorageId]="gridStorageId" filterId="taskCompleted" [datatable]="dt">
                              </pcalendar-wrapper>
                            </div>
                          </th>
                        <th grid-input-filter [dt]="dt" searchField="serialNumber"
                            [hidden]="!commonGrid.isVisibleCol('serialNumber',gridSettings)" [gridSettings]="gridSettings">
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-model>
                    <tr class="ui-selectable-row">
                        <td [hidden]="!commonGrid.isVisibleCol('id', gridSettings)">
                            {{model.id}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('description', gridSettings)">
                            {{model.description}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('monitorType', gridSettings)">
                            {{model.monitorType}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('result', gridSettings)">
                            {{model.result}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('passing', gridSettings)">
                            {{model.passing}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('workerName', gridSettings)">
                            {{model.workerName}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('taskCompleted', gridSettings)">
                            {{model.taskCompleted}}
                        </td>
                        <td [hidden]="!commonGrid.isVisibleCol('serialNumber', gridSettings)">
                            {{model.serialNumber}}
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr>
                        <td colspan="100" style="text-align:left">No Monitors to display</td>
                    </tr>
                </ng-template>
            </p-table>
        </widget>
    </div>
  </div>
