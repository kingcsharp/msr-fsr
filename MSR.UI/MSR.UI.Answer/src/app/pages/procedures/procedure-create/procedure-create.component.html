<div class="container">
    <div class="row">
        <div class="col-12">
          <h1 class="page-title">
            <i class="fas fa-plus mx-2"></i>
            <span>Create Procedure</span>
          </h1>
        </div>
      </div>
    <div class="row">
        <form class="col-12">
            <div class="form-group">
                <label for="proceduretype" class="col-form-label text-left">
                    Procedure Type
                </label>
                <div class="col-12">
                    <p-dropdown placeholder="Select Major Group" name="proceduretype" [options]="availableProcedureTypes"
                        showClear="true" [(ngModel)]="selectedProcedureType" data-cy="majorgroup-dropdown">
                    </p-dropdown>
                </div>
            </div>
            <div class="form-group">
                <label for="name" class="col-form-label text-left">
                    Name
                </label>
                <input type="text" name="name" [(ngModel)]="procedure.name" data-validate="parsley"
                    data-parsley-trigger="change" data-parsley-minlength="3" data-parsley-required="true"
                    class="form-control input-transparent" tooltip="Name of Procedure"
                    data-cy="name-input">
            </div>
            <div class="form-group">
                <label for="referencefiles" class="col-form-label text-left">
                    Reference Files
                </label>
                <cmh-file-uploader name="referencefiles" class="col-12" *ngIf="procedure.referenceFiles !== undefined"
                    [menuItem]="menuItems.Templates" multiple="multiple" [(files)]="procedure.referenceFiles">
                </cmh-file-uploader>
            </div>
            <div class="form-group" *ngIf='procedure !== undefined'>
                <label for="comment" class="col-form-label text-left">
                    Comments
                </label>
                <ckeditor-wrapper [editorcontent]="procedure.comment"
                    (editorContentChange)="procedure.comment = $event"></ckeditor-wrapper>
            </div>
            <div class="form-group">
                <label for="roles" class="col-form-label text-left">
                    Roles
                </label>
                <p-multiSelect name="role" [options]="availableRoles" [(ngModel)]="selectedRoles"
                    data-cy="roles-multiselect">
                </p-multiSelect>
            </div>
            <div class="form-group">
                <label for="duration" class="col-form-label text-left">
                    Estimated Procedure Time
                </label>
                <input type="number" name="duration" [(ngModel)]="procedure.duration" data-validate="parsley"
                    data-parsley-trigger="change" data-parsley-minlength="3" data-parsley-required="true"
                    class="form-control input-transparent" tooltip="Duration of Procedure"
                    data-cy="duration-input">
            </div>
            <div class="form-group">
                <label for="durationType" class="col-form-label text-left">
                    Duration Type
                </label>
                <div class="col-12">
                    <p-dropdown placeholder="Select Duration Type" name="durationType" [options]="durationTypeOptions"
                        showClear="true" [(ngModel)]="procedure.durationType" data-cy="majorgroup-dropdown">
                    </p-dropdown>
                </div>
            </div>
        </form>
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary m-2" (click)="save()"
            data-cy="save-button">Save</button>
        <button type="button" class="btn btn-warning m-2" [routerLink]="['../procedures']"
            data-cy="cancel-button">Cancel</button>
    </div>
</div>
