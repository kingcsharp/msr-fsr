<h1 class="page-title">
  <i class="{{'fas '+globals.activeMenu.icon}}"></i>
  {{globals.activeMenu.name}}
</h1>
<widget>
  <p-table #dt [value]="data" dataKey="id" styleClass="ui-table-customers" [rowHover]="true" [rows]="10"
    [showCurrentPageReport]="true" [rowsPerPageOptions]="[10,25,50,100]" [loading]="loading" [paginator]="true"
    currentPageReportTemplate="Showing {first}-{last} of {totalRecords}" [filterDelay]="0" stateStorage="local"
    stateKey="{{gridStorageId}}">
    <ng-template pTemplate="caption">
      <div class="text-right">
        <button *ngIf="canAddGroups" (click)="showDialog()" class="btn btn-success width-100 mb-xs" role="button"
          data-cy="add-button">
          + Add
        </button>
        <grid-options [(defaultColumns)]="gridSettings" [gridStorageId]="gridStorageId" [ptable]="dt"
          [gridVersion]="gridVersion" data-cy="usergrid-options">
        </grid-options>
      </div>
    </ng-template>
    <ng-template pTemplate="header">
      <tr>
        <th *ngFor="let col of gridSettings" [hidden]="!col.visible" [pSortableColumn]="col.id"
          data-cy="usertable-header">
          {{col.label}} <p-sortIcon [field]="col.id"></p-sortIcon>
        </th>
        <th></th>
      </tr>
      <tr>
        <th [hidden]="!cg.isVisibleCol('id',gridSettings)">
          <div class="position-relative">
            <input id="id" pInputText type="text" tooltip="Search by Id"
              (input)="dt.filter($event.target.value, 'id', 'contains')" class="ui-column-filter"
              [value]="dt.filters['id']?.value">
            <i *ngIf="dt.filters['id']?.value" class="fclear pi pi-times pointer" (click)="cg.filter(dt,'id')"></i>
          </div>
        </th>
        <th [hidden]="!cg.isVisibleCol('isActive',gridSettings)">
          <multiselect-wrapper [gridStorageId]="gridStorageId" [options]="statuses" [filterId]="'isActive'"
            [defaultText]="'Select Status'" [defaultTextTooltip]="''" [datatable]="dt">
          </multiselect-wrapper>
        </th>
        <th [hidden]="!cg.isVisibleCol('name',gridSettings)">
          <div class="position-relative">
            <input pInputText type="text" tooltip="Search by Name"
              (input)="dt.filter($event.target.value, 'name', 'contains')" class="ui-column-filter"
              [value]="dt.filters['name']?.value">
            <i *ngIf="dt.filters['name']?.value" class="fclear pi pi-times pointer" (click)="cg.filter(dt,'name')"></i>
          </div>
        </th>
        <th [hidden]="!cg.isVisibleCol('groupRoles',gridSettings)">
          <div class="position-relative">
            <multiselect-wrapper [gridStorageId]="gridStorageId" [options]="roles" [filterId]="'rolesStr'"
              [defaultText]="'Select Group Roles'" [defaultTextTooltip]="''" [datatable]="dt">
            </multiselect-wrapper>
          </div>
        </th>
        <th [hidden]="!cg.isVisibleCol('createdOn',gridSettings)">
          <div class="position-relative" tooltip="Search by Created Date">
            <pcalendar-wrapper [gridStorageId]="gridStorageId" [filterId]="'createdOn'" [datatable]="dt">
            </pcalendar-wrapper>
          </div>
        </th>
        <th [hidden]="!cg.isVisibleCol('lastUpdatedOn',gridSettings)">
          <div class="position-relative" tooltip="Search by Last Updated On Date">
            <pcalendar-wrapper [gridStorageId]="gridStorageId" [filterId]="'lastUpdatedOn'" [datatable]="dt">
            </pcalendar-wrapper>
          </div>
        </th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-workflowGroup>
      <tr class="ui-selectable-row">
        <td [hidden]="!cg.isVisibleCol('id', gridSettings)">
          {{workflowGroup.id}}
        </td>
        <td class="text-center" [hidden]="!cg.isVisibleCol('isActive', gridSettings)">
          <ng-template [ngIf]="!canActivate">
            <p-inputSwitch disabled="true" [(ngModel)]="workflowGroup.isActive"
              (ngModelChange)="changeUserStatus(workflowGroup)">
            </p-inputSwitch>
          </ng-template>
          <ng-template [ngIf]="canActivate">
            <p-inputSwitch [(ngModel)]="workflowGroup.isActive" (ngModelChange)="changeUserStatus(workflowGroup)">
            </p-inputSwitch>
          </ng-template>
        </td>
        <td class="text-capitalize" [hidden]="!cg.isVisibleCol('name',gridSettings)">
          {{workflowGroup.name}}
        </td>
        <td [hidden]="!cg.isVisibleCol('groupRoles',gridSettings)">
          <span *ngFor="let role of workflowGroup.groupRoles" class="badge mr-xs badge-secondary">{{role.name}}</span>
        </td>
        <td [hidden]="!cg.isVisibleCol('createdOn',gridSettings)">
          {{workflowGroup.createdOn | date :'short' }}
        </td>
        <td [hidden]="!cg.isVisibleCol('createdBy',gridSettings)">
          {{workflowGroup.createdBy }}
        </td>
        <td [hidden]="!cg.isVisibleCol('lastUpdatedOn',gridSettings)">
          {{workflowGroup.lastUpdatedOn | date :'short' }}
        </td>
        <td [hidden]="!cg.isVisibleCol('lastUpdatedBy',gridSettings)">
          {{workflowGroup.lastUpdatedBy }}
        </td>
        <td>
          <i *ngIf="canEditGroups" class="fa fa-cog pointer" tooltip="Edit User"
            (click)="showDialog(workflowGroup)"></i>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="8" style="text-align:left">No workflow groups found.</td>
      </tr>
    </ng-template>
  </p-table>
</widget>
