version: 0.2

phases:
  install:
    commands:
      - cd ./MSR.UI/MSR.UI.Answer/
      - yarn install --frozen-lockfile
  pre_build:
    commands:
      - yarn lint
  build:
    commands:
      - yarn buildprod
      - aws s3 cp --recursive dist/  s3://answer-ui-prod
      - aws cloudfront create-invalidation --distribution-id E1C3X9JHVR2W91 --paths "/*"
