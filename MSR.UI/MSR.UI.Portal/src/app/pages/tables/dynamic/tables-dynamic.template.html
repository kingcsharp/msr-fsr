<ol class="breadcrumb">
  <li class="breadcrumb-item">YOU ARE HERE</li>
  <li class="breadcrumb-item active">Tables Dynamic</li>
</ol>
<h1 class="page-title">Dynamic - <span class="fw-semi-bold">Tables</span></h1>
<section class="widget" widget>
  <header>
    <h4>The <span class="fw-semi-bold">Angular</span> Way</h4>
    <div class="widget-controls">
      <a data-widgster="expand" title="Expand" href="#"><i class="la la-angle-up"></i></a>
      <a data-widgster="collapse" title="Collapse" href="#"><i class="la la-angle-down"></i></a>
      <a data-widgster="close" title="Close" href="#"><i class="la la-remove"></i></a>
    </div>
  </header>
  <div class="widget-body">
    <p>
      Column sorting, live search, pagination. Built with
      <a href="https://github.com/swimlane/ngx-datatable" target="_blank">swimlane/ngx-datatable</a>
    </p>
    <div class="mt">
      <div class="float-right mb">
        <div class="input-group input-group-rounded">
          <span class="input-group-addon">
            <i class="fa fa-search"></i>
          </span>
          <input class="form-control input-transparent"
                 (keyup)='updateFilter($event)' type="text" placeholder="Search Table">
        </div>
      </div>
      <div>
      </div>
    </div>
  </div>
</section>
<section class="widget" widget>
  <header>
    <h4>Ng2 <span class="fw-semi-bold">Tables</span></h4>
    <div class="widget-controls">
      <a data-widgster="expand" title="Expand" href="#"><i class="la la-angle-up"></i></a>
      <a data-widgster="collapse" title="Collapse" href="#"><i class="la la-angle-down"></i></a>
      <a data-widgster="close" title="Close" href="#"><i class="la la-remove"></i></a>
    </div>
  </header>
  <div class="widget-body">
    <p>
      Simple table extension with sorting, filtering and pagination for Angular2 apps. Built with
      <a href="http://valor-software.github.io/ng2-table/" target="_blank">ng2-table</a>
    </p>
    <p>
      <input *ngIf="config.filtering"
             [ngTableFiltering]="config.filtering"
             (tableChanged)="onChangeTable(config)"
             class="form-control input-transparent"
             placeholder="Filter Table" type="text">
    </p>
