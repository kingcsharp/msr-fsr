<div class="container">
    <div class="row" *ngIf="helpPageToEdit !== undefined">
        <div class="col-6">
            <h1 class="page-title">
                <i class="far fa-edit mx-2" *ngIf="helpPageToEdit.id !== undefined"></i>
                <i class="fas fa-plus mx-2" *ngIf="helpPageToEdit.id === undefined"></i>
                <span *ngIf="helpPageToEdit.id === undefined" data-cy="page-title">Create Help Page</span>
                <span *ngIf="helpPageToEdit.id !== undefined" data-cy="page-title">Edit Help Page</span>
            </h1>
        </div>
        <div class="col-6" [ngClass]="['d-flex', 'justify-content-end']">
            <helpbutton-wrapper [ngClass]="['my-auto']"></helpbutton-wrapper>
        </div>
    </div>
    <div class="row" *ngIf="helpPageToEdit != null">
        <form class="col-12">
            <div class="form-group">
                <label for="title" class="col-form-label text-left">
                    Title
                </label>
                <input type="text" id="title" name="title" [(ngModel)]="helpPageToEdit.title" data-cy="title-input"
                    data-validate="parsley" data-parsley-trigger="change" data-parsley-minlength="3"
                    data-parsley-required="true" class="form-control input-transparent" tooltip="Title of Help Page"
                    placeholder="">
            </div>
            <div class="form-group" *ngIf="helpPageToEdit !== undefined">
                <label for="friendlyurl" class="col-form-label text-left">
                    Friendly Url
                </label>
                <p-dropdown  name="friendlyurl" [options]="urls" showClear="true" [(ngModel)]="helpPageToEdit.friendlyURL" editable="false" 
                placeholder="Select a Friendly Url" data-cy="friendlyurl-dropdown"></p-dropdown>
            </div>
            <div class="form-group">
                <label for="articlecontent" class="col-form-label text-left">
                    Article Content
                </label>
                <ckeditor-wrapper [editorcontent]="helpPageToEdit.content"
                    (editorContentChange)="helpPageToEdit.content = $event"></ckeditor-wrapper>
            </div>
            <div class="form-group">
                <label for="roles" class="col-form-label text-left">
                    Roles
                </label>
                <multiselect-wrapper-form [options]="availableRoles" [limit]="10" [(model)]="selectedRoles"
                defaultLabelProperty="name" defaultId="id" defaultLabel="Select Roles" data-cy="roles-multiselect">
              </multiselect-wrapper-form>
            </div>
        </form>
    </div>
    <div class="row">
        <button type="button" class="btn btn-primary m-2" (click)="saveHelpPage()" *ngIf="helpPageToEditId == 0"
            data-cy="save-button">Save</button>
        <button type="button" class="btn btn-primary m-2" (click)="updateHelpPage()" *ngIf="helpPageToEditId != 0"
            data-cy="update-button">Update</button>
        <button type="button" class="btn btn-warning m-2" [routerLink]="['../help']">Cancel</button>
    </div>
</div>
