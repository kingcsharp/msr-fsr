version: 0.2

env:
  secrets-manager:
    GITHUB_TOKEN: "github_pat:personal_access_token"
phases:
  install:
    commands:
      - cd ./MSR.UI/MSR.UI.Portal/
      - yarn install --frozen-lockfile  
  build:
    commands:
      - npx ng build --configuration=dev
  post_build:
    commands:
      - |
          if [ "$CODEBUILD_BUILD_SUCCEEDING" == "1" ]; then
            STATE="success" ;
            MESSAGE="The build succeeded!"
          else
            STATE="failure" ;
            MESSAGE="The build failed."
          fi
      - |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/MSR-FSR/Answer3.0/statuses/$CODEBUILD_RESOLVED_SOURCE_VERSION \
          -d '{"state":"'"$STATE"'","target_url":"'"https://us-west-2.console.aws.amazon.com/codesuite/codebuild/425480257575/projects/Answer30-Portal-UI-dev/build/${CODEBUILD_BUILD_ID}"'","description":"'"$MESSAGE"'","context":"Build Answer UI"}'
      - |
        if [ "$BRANCHNAME" == "Develop" ]; then
          aws s3 cp --recursive dist/  s3://answer-portal-ui-qa ;
          aws cloudfront create-invalidation --distribution-id EWYQGAJYKCGEH --paths "/*"
        fi