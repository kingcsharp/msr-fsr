version: 0.2

env:
  secrets-manager:
    DOCKERHUB_PASS: "dockerhub:password"
    DOCKERHUB_USERNAME: "dockerhub:username"
    GITHUB_TOKEN: "github_pat:personal_access_token"
phases:
  build:
    commands:
      - docker login --username $DOCKERHUB_USERNAME --password $DOCKERHUB_PASS
      - docker build -f ./MSR.Answer.Processor/Dockerfile -t msr-processor .
  post_build:
    commands:
      - |
          if [ "$CODEBUILD_BUILD_SUCCEEDING" == "1" ]; then
            STATE="success" ;
            MESSAGE="The build succeeded!"
          else
            STATE="failure" ;
            MESSAGE="The build failed."
          fi
      - |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/MSR-FSR/Answer3.0/statuses/$CODEBUILD_RESOLVED_SOURCE_VERSION \
          -d '{"state":"'"$STATE"'","target_url":"'"https://us-west-2.console.aws.amazon.com/codesuite/codebuild/425480257575/projects/Answer30-Proceesor-dev/build/${CODEBUILD_BUILD_ID}"'","description":"'"$MESSAGE"'","context":"Build Processor"}'
      - |
        if [ "$BRANCHNAME" == "Develop" ]; then
          TAG="$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | head -c 8)" ;
          docker tag msr-processor "${ACCOUNT_URL}/msr-processor:${TAG}" ;
          aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${ACCOUNT_URL} ;
          docker push "${ACCOUNT_URL}/msr-processor:${TAG}" ;
          sh ${SCRIPT_UPDATE_IMAGE_API} QA ${TAG} ${API_COMPOSE_PROCESSOR} ;
          cat ${API_COMPOSE_PROCESSOR} ;
          ecs-cli configure --cluster ${QA_CLUSTER} --default-launch-type FARGATE --config-name ${CLUSTER_CONFIG} --region ${REGION} ;
          ecs-cli compose --file ${API_COMPOSE_PROCESSOR} --project-name ${QA_PROJECT_PROCESSOR} service up --create-log-groups --cluster-config ${CLUSTER_CONFIG} --timeout ${TIMEOUT}
        fi