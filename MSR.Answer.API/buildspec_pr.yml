version: 0.2

env:
  secrets-manager:
    DOCKERHUB_PASS: "dockerhub:password"
    DOCKERHUB_USERNAME: "dockerhub:username"
    GITHUB_TOKEN: "github_pat:personal_access_token"
phases:
  build:
    commands:
      - docker login --username $DOCKERHUB_USERNAME --password $DOCKERHUB_PASS
      - cd ./reverseproxy/
      - docker build -f ./Dockerfile --build-arg NGINX_CONF=dev -t msr-rp .
      - cd ..
      - docker build -f ./MSR.Answer.API/Dockerfile -t msr-api .
  post_build:
    commands:
      - |
          if [ "$CODEBUILD_BUILD_SUCCEEDING" == "1" ]; then
            STATE="success" ;
            MESSAGE="The build succeeded!"
          else
            STATE="failure" ;
            MESSAGE="The build failed."
          fi
      - |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/MSR-FSR/Answer3.0/statuses/$CODEBUILD_RESOLVED_SOURCE_VERSION \
          -d '{"state":"'"$STATE"'","target_url":"'"https://us-west-2.console.aws.amazon.com/codesuite/codebuild/425480257575/projects/Answer30-API-dev/build/${CODEBUILD_BUILD_ID}"'","description":"'"$MESSAGE"'","context":"Build API"}'
